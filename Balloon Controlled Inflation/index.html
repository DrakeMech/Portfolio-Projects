<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balloon Controlled Inflation</title>
  <script type="importmap">{ "imports": { "ixfx/": "/ixfx/" } } </script>

</head>

<body>
  <style>
    :root {
      --hue: 20;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      --bg: hsl(var(--hue), 10%, 90%);
      --fg: hsl(var(--hue), 90%, 15%);
    }

    body {
      background-color: white;
      color: var(--fg);
      font-family: var(--font);
    }

    h1 {
      color: hsl(var(--hue), 100%, 30%);
    }

    section {
      height: 100vh;
      align-content: center;
    }

    #vis {
      border-radius: 50%;
      scale:1;
      width: 5em;
      height: 5em;
      border: 2px hsla(0, 87%, 56%, 0.996) solid;
      align-self: center;
      transition: 0.2s;
    }

    #vis.pressed {
      background-color: hsla(0, 87%, 56%, 0.996);
    }
  </style>
  <section>
    <div id="vis"></div>
    <div id="info"></div>
    <script type="module" src="script.js"></script>
  </section>
</body>

</html>
